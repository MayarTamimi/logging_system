services:
  postgres:
    image: postgres:17
    container_name: logs-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: logs

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
  rabbitmq:
    image: rabbitmq:4-management
    container_name: logs-rabbitmq
    restart: unless-stopped

    ports:
      - "5672:5672"
      - "15672:15672"
      
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

